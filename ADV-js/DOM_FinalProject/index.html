<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="allElem">
        <div class="todo elem" id="0">
          <img src="./19085317701647332751-128.png" />
        </div>
        <div class="daily elem" id="1">
          <img src="./969537571691574311-128.png" />
        </div>
        <div class="pomo elem" id="2">
          <img src="./3214427571548243688-128.png" />
        </div>
        <div class="moti elem" id="3">
          <img src="./20217948591667494396-128.png" />
        </div>
        <div class="goals elem" id="4">
          <img src="./4802380751605806465-128.png" />
        </div>
      </section>

      <section class="fullElem">
        <div class="topbar">
          <h1>Your Personal Task List</h1>
          <button class="back" id="0">Close</button>
        </div>
        <div class="todo-container">
          <div class="addTask">
            <form>
              <input type="text" id="taskName" placeholder="Enter Task" />
              <textarea
                placeholder="Enter Details"
                name
                id
                cols="30"
                rows="10"
              ></textarea>
              <div class="mark-imp">
                <input type="checkbox" name="check" id="check" />
                <label for="check">Mark as Important</label>
              </div>
              <button class="addTaskBtn">Add Task</button>
            </form>
          </div>
          <div class="allTask">
            <div class="task">
            <div class="task">   
        <h5>${elem.task} <span class="${elem.imp}">imp !</span></h5>
        <button>Mark as Completed</button>  
    </div>
            </div>
          </div>
        </div>
      </section>
      <section class="fullElem">
        <div class="topbar">
          <h1>Daily Planner</h1>
          <button class="back" id="1">Close</button>
        </div>
      </section>
      <section class="fullElem">
        <div class="topbar">
          <h1>Pomodoro Timer</h1>
          <button class="back" id="2">Close</button>
        </div>
      </section>
      <section class="fullElem">
        <div class="topbar">
          <h1>Motivational Quote</h1>
          <button class="back" id="3">Close</button>
        </div>
      </section>
      <section class="fullElem">
        <div class="topbar">
          <h1>Daily Goals</h1>
          <button class="back" id="4">Close</button>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
